[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlx-man"
version = "0.5.0"
description = "Apple Silicon MLX model manager and runner — download, manage, and serve local LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Gabriel Cavalcante" },
]
keywords = ["mlx", "llm", "apple-silicon", "macos", "cli", "model-manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx-lm>=0.20.0",
    "rich>=13.7.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
mlx-man = "mlx_man.main:main"

[project.urls]
Homepage = "https://github.com/gabrielsscavalcante/mlx-man"
Repository = "https://github.com/gabrielsscavalcante/mlx-man"
Issues = "https://github.com/gabrielsscavalcante/mlx-man/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_man"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 100
