name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Validate, Test, and Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run verification test suite
        run: |
          pytest tests/ --ignore=tests/test_ui_snapshots.py -v

      - name: Build sdist and wheel
        run: |
          uv build

      - name: Verify built wheel
        run: |
          uv run --with dist/*.whl python -c "import mlx_man; print('Verified version:', mlx_man.__version__)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
